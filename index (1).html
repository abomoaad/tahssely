function send(){return `<div class="card"><h3>📨 أرسل نتيجتك لمعلمك</h3><ol class="tips"><li>اضغط «حفظ ملف نتيجتي».</li><li>أرفق الملف عند تسليمه لمعلمك، واكتب اسمك الثلاثي كما يُطلب منك.</li></ol><div class="nav"><button class="btn" onclick="sv()">💾 حفظ ملف نتيجتي</button><button class="btn g" onclick="cp()">📋 نسخ النتيجة</button></div><textarea id="rs" readonly hidden onclick="this.select()" style="width:100%;height:140px;margin-top:8px;font:inherit;direction:rtl;padding:8px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);color:var(--ink)">${txt()}</textarea></div>`}
function showTxt(){const e=$('rs');e.hidden=false;e.select()}
async function sv(){try{const d=window.claude&&await claude.use("downloads");const fn="tahsili-M"+(k0+1)+"-result.txt";if(d){await d.save({filename:fn,data:txt()})}else{const u=URL.createObjectURL(new Blob([txt()],{type:"text/plain;charset=utf-8"})),l=document.createElement("a");l.href=u;l.download=fn;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast("تم حفظ الملف ✅")}}catch(x){if(x&&x.code=="declined")return;showTxt();toast("تعذّر الحفظ المباشر. انسخ النتيجة من المربع وألصقها في ملف نصي.")}}
function cp(){const ok=()=>toast("تم النسخ ✅");try{navigator.clipboard.writeText(txt()).then(ok,showTxt)}catch(x){showTxt()}}
function fin(){clearInterval(tmr);const sc=m.S.map((s,j)=>Q.filter((q,k)=>q.s==j&&ans[k]==q.a).length),t=sc.reduce((a,b)=>a+b,0),pc=Math.round(t/Q.length*100);
const msg=pc>=90?"مبهر! أنت نجم التحصيلي 🌟":pc>=75?"ممتاز! أنت قريب جدًا من القمة 💪":pc>=50?"بداية طيبة، وبالمراجعة ستتفوق 📈":"لا تقلق، كل بطل بدأ من هنا. راجع إجاباتك وأعد المحاولة، وستتحسن بإذن الله 🌱";
A.innerHTML=head()+`<div class="hero"><h1>النتيجة 🎉</h1><div class="big">${t} / ${Q.length}</div><p style="text-align:center"><b>${pc}%</b> - ${msg}</p></div>
<div style="margin:12px 0"><button class="btn" style="width:100%" onclick="lvShow()">📈 اعرف مستواك في كل قسم وخطة العلاج</button><div id="lv" hidden></div></div><div class="card"><h3>📊 تقرير نتائجك في كل قسم</h3>${m.S.map((s,j)=>{const u=Q.filter((q,k)=>q.s==j&&ans[k]<0).length,c=sc[j],w=N-c-u,p=c*100/N;return `<div class="row"><b>${s[0]}</b><b>${c} / ${N} (${p}%)</b></div><div class="bar"><div style="width:${p}%;background:var(--c${j})"></div></div><p>✅ صحيحة: ${c} · ❌ خاطئة: ${w} · ⬜ بلا إجابة: ${u}<br>${p>=80?"مستوى ممتاز، حافظ عليه 🌟":p>=50?"مستوى جيد، راجع أخطاءك لترتقي 📈":"تحتاج مراجعة هذه المادة، وستتحسن بالتدريب 🌱"}</p>`}).join("")}<p style="margin-top:12px"><b>⭐ أقوى أقسامك:</b> ${m.S[sc.indexOf(Math.max(...sc))][0]} · <b>🎯 ركّز على:</b> ${m.S[sc.indexOf(Math.min(...sc))][0]}</p></div>
${R.t==0?send():""}
<h3>📝 مراجعة الإجابات</h3>${Q.map((q,k)=>`<div class="card"><p>${m.S[q.s][0]} - سؤال ${k%N+1}</p><div class="q" dir="auto">${q.q}</div>${q.f?`<div class="fig">${FIG[q.f]}</div>`:""}${q.o.map((o,x)=>`<div class="o ${x==q.a?'ok':x==ans[k]?'no':''}"><i>${L[x]}</i><span>${o}</span></div>`).join("")}${ans[k]<0?'<p>لم تتم الإجابة</p>':''}</div>`).join("")}
<div class="nav"><button class="btn g" onclick="intro(k0)">إعادة النموذج</button><button class="btn" onclick="home()">القائمة الرئيسية</button></div>`+foot();scrollTo(0,0)}
home();
</script></body></html>
